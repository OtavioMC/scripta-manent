name: scriptamanent

services:
  php:
    image: ghcr.io/otaviomc/scripta-manent-php:producao
    restart: unless-stopped
    environment:
      BANCO_HOST: mysql
      BANCO_NOME: scripta_manent
      BANCO_USUARIO: aplicacao
      BANCO_SENHA: ${BANCO_SENHA:?defina BANCO_SENHA no .env}
      GOTENBERG_URL: http://gotenberg:3000
      REDIS_URL: tcp://redis:6379
      NGINX_HTPASSWD: ${NGINX_HTPASSWD:?defina NGINX_HTPASSWD no .env}
    depends_on:
      mysql:
        condition: service_healthy
      gotenberg:
        condition: service_started
      redis:
        condition: service_started
    mem_limit: 512m

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BANCO_SENHA_ROOT:?defina BANCO_SENHA_ROOT no .env}
      MYSQL_DATABASE: scripta_manent
      BANCO_SENHA: ${BANCO_SENHA:?defina BANCO_SENHA no .env}
    volumes:
      - mysql:/var/lib/mysql
      - ./banco:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    mem_limit: 1g

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    command:
      - gotenberg
      - --api-timeout=20s
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
    restart: unless-stopped
    mem_limit: 1g

  redis:
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
    restart: unless-stopped
    mem_limit: 128m

  web:
    image: ghcr.io/otaviomc/scripta-manent-web:producao
    restart: unless-stopped
    depends_on: [php]
    mem_limit: 128m

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN no .env}
    depends_on: [web]
    mem_limit: 128m

volumes:
  mysql:
