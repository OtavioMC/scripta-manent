version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: php
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: composer
        update-types: ['version-update:semver-major']
      - dependency-name: nginx
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: mysql
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: nginx
        update-types: ['version-update:semver-major']
      - dependency-name: redis
        update-types: ['version-update:semver-major']
    groups:
      docker-compose:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
