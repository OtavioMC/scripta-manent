name: scripta-manent

services:
  php:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    environment:
      BANCO_HOST: mysql
      BANCO_NOME: scripta_manent
      BANCO_USUARIO: aplicacao
      BANCO_SENHA: ${BANCO_SENHA:?rode sh bin/gerar-env para criar o .env}
      GOTENBERG_URL: http://gotenberg:3000
      REDIS_URL: tcp://redis:6379
      NGINX_HTPASSWD: ${NGINX_HTPASSWD:?rode sh bin/gerar-env para criar o .env}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      gotenberg:
        condition: service_started
      redis:
        condition: service_started

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/comum.conf:/etc/nginx/comum.conf:ro
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
      - ./vendor/twbs/bootstrap/dist:/app/bootstrap:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${BANCO_SENHA_ROOT:?rode sh bin/gerar-env para criar o .env}
      MYSQL_DATABASE: scripta_manent
      BANCO_SENHA: ${BANCO_SENHA:?rode sh bin/gerar-env para criar o .env}
    volumes:
      - mysql:/var/lib/mysql
      - ./banco:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    command:
      - gotenberg
      - --api-timeout=20s
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*

  redis:
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru

volumes:
  mysql:
