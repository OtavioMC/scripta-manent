name: scripta-manent

services:
  php:
    build:
      context: .
      target: dev
    volumes:
      - .:/app

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - php
